name: share_my_apk
description: "CLI tool for building and uploading Android APKs."
version: 1.1.4-beta

# Package metadata for pub.dev
homepage: https://github.com/wm-jenildgohel/share_my_apk
repository: https://github.com/wm-jenildgohel/share_my_apk
documentation: https://pub.dev/documentation/share_my_apk/latest/
issue_tracker: https://github.com/wm-jenildgohel/share_my_apk/issues


# Topics for better discoverability
topics:
  - apk-builder
  - android
  - upload
  - flutter
  - cli

platforms:
  android: # This package is specifically for Android APK building and uploading.
           # Other platforms are not supported as it relies on Android-specific build processes.
           # Not compatible with WASM due to dart:io usage.

environment:
  sdk: ^3.8.1

dependencies:
  args: ^2.7.0
  http: ^1.4.0
  logging: ^1.3.0
  path: ^1.9.1
  process_run: ^1.2.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
  mockito: ^5.4.4
  build_runner: ^2.4.12

executables:
  share_my_apk:
