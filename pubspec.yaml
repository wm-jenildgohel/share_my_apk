  path: ^1.9.1
  process_run: ^1.2.4
  yaml: ^3.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.2
  mockito: ^5.4.4
  build_runner: ^2.4.12

executables:
  share_my_apk:
